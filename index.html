<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Сборка ПК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --surface: #171717;
    --surface-2: #1f1f1f;
    --surface-3: #262626;
    --border: #2e2e2e;
    --border-soft: #232323;
    --text: #ededed;
    --text-light: #a0a0ab;
    --text-muted: #6e6e78;
    --green: #3ecf8e;
    --green-hover: #4fd39b;
    --green-dark: #249361;
    --on-green: #101511;
    --amber: #f4a72c;
    --blue: #4d9fff;
    --red: #e5484d;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== ОКНО ВХОДА ===== */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(62,207,142,.16), transparent 60%),
      radial-gradient(700px 340px at 85% 110%, rgba(36,147,97,.13), transparent 60%),
      var(--bg);
  }
  .login-box {
    background: rgba(23,23,23,.92);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
    width: 380px;
    backdrop-filter: blur(8px);
  }
  .login-box h1 { font-size: 21px; text-align: center; margin-bottom: 6px; font-weight: 600; letter-spacing: -.01em; }
  .login-box .sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .login-box label { display: block; font-size: 12px; margin: 14px 0 6px; color: var(--text-light); }
  .login-box input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .login-box input:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(62,207,142,.15);
  }
  .login-box button {
    width: 100%; margin-top: 20px; padding: 10px;
    background: var(--green); color: var(--on-green); border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .login-box button:hover { background: var(--green-hover); }
  .login-box .btn-signup {
    background: var(--surface-2); color: var(--text-light);
    border: 1px solid var(--border); margin-top: 10px; font-size: 13px;
  }
  .login-box .btn-signup:hover { background: var(--surface-3); color: var(--text); }
  .login-error { color: #ff8f8f; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
  .login-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 14px; }

  /* ===== ШАПКА ===== */
  #app { display: none; }
  header {
    background: rgba(23,23,23,.85);
    backdrop-filter: blur(10px);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header .logo { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  header .logo span { color: var(--green); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .btn-logout {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text-light);
    font-family: inherit; transition: .15s;
  }
  .btn-logout:hover { background: var(--surface-2); color: var(--text); }

  /* ===== КОНТЕНТ ===== */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 28px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .tabs {
    display: flex; gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px;
  }
  .tab-btn {
    padding: 7px 18px; border: none; border-radius: 7px; cursor: pointer;
    font-size: 13px; background: transparent; color: var(--text-light);
    font-family: inherit; transition: .15s;
  }
  .tab-btn.active { background: var(--green); color: var(--on-green); font-weight: 500; }
  .tab-btn:not(.active):hover { background: var(--surface-2); color: var(--text); }
  .btn-add {
    background: var(--green); color: var(--on-green); border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .btn-add:hover { background: var(--green-hover); }
  .stats { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  .filter-select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; cursor: pointer; background: var(--surface-2);
    color: var(--text); display: none; font-family: inherit;
  }
  .filter-input {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--surface-2); color: var(--text);
    display: none; font-family: inherit; width: 220px;
  }
  .filter-input::placeholder { color: var(--text-muted); }
  .filter-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(62,207,142,.12); }
  .shop-link { color: var(--green); text-decoration: none; font-size: 13px; }
  .shop-link:hover { text-decoration: underline; }
  .cust-name { font-weight: 500; }
  .cust-phone { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cust-login { font-size: 12px; color: var(--text-light); margin-top: 2px; font-style: italic; }

  /* ===== КОНФИГУРАЦИЯ В ЗАКАЗЕ (СТАТИЧНАЯ ТАБЛИЦА) ===== */
  .config-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .config-table th {
    text-align: left; font-size: 11px; color: var(--text-muted);
    padding: 4px 8px 6px; border-bottom: 1px solid var(--border);
    font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  }
  .config-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .config-table tr:last-child td { border-bottom: none; }
  .config-line { font-size: 13px; color: var(--text); white-space: nowrap; width: 34%; }
  .config-table .config-part { width: 100%; min-width: 0; }
  .config-table .config-cost { width: 100%; min-width: 0; }
  .config-table select, .config-table input {
    padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
  }
  .config-table select:focus, .config-table input:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(62,207,142,.12);
  }
  .config-cost::placeholder { color: var(--text-muted); }
  .config-sum {
    font-weight: 600; font-size: 13px; color: var(--text);
    margin-top: 10px; min-height: 18px; font-family: var(--mono);
  }
  .config-profit { color: var(--green); }

  /* ===== КНОПКА КОПИРОВАНИЯ ЗАКАЗА ===== */
  .num-wrap { display: flex; align-items: center; gap: 6px; }
  .btn-copy {
    background: none; border: none; cursor: pointer;
    font-size: 14px; padding: 0 2px; line-height: 1; color: var(--text-muted);
    transition: color .15s, transform .15s;
  }
  .btn-copy:hover { transform: scale(1.2); color: var(--green); }

  /* ===== ТАБЛИЦА ===== */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; padding: 12px 14px;
    color: var(--text-muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; font-weight: 500; font-family: var(--mono);
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,.02);
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(62,207,142,.03); }
  .order-num {
    font-weight: 600; color: var(--green); cursor: pointer;
    text-decoration: none; border-bottom: 1px dashed rgba(62,207,142,.4);
  }
  .order-num:hover { color: var(--green-hover); border-bottom-style: solid; }

  /* ===== МЕНЮ ВЫБОРА СТАТУСА ===== */
  .status-menu {
    display: none; position: fixed; z-index: 200;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); min-width: 190px;
  }
  .status-menu.open { display: block; }
  .status-menu .menu-title {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    padding: 6px 10px 4px; letter-spacing: .1em; font-family: var(--mono);
  }
  .status-menu .menu-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: none; background: none;
    border-radius: 7px; cursor: pointer; font-size: 13px;
    color: var(--text); font-family: inherit; transition: .12s;
  }
  .status-menu .menu-item:hover { background: var(--surface-2); }
  .status-menu .menu-item.current { font-weight: 600; color: var(--green); }
  .status-menu .menu-item.current::after { content: ' ✓'; }
  .order-date { color: var(--text-muted); font-size: 11px; font-family: var(--mono); }
  .comment-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-light); }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
    border: 1px solid transparent; transition: filter .15s;
  }
  .badge:hover { filter: brightness(1.15); }
  .badge.soglasovanie { background: rgba(244,167,44,.12); color: var(--amber); border-color: rgba(244,167,44,.28); }
  .badge.vrabote      { background: rgba(77,159,255,.12); color: var(--blue); border-color: rgba(77,159,255,.28); }
  .badge.zakryt       { background: rgba(62,207,142,.12); color: var(--green); border-color: rgba(62,207,142,.28); }

  .actions { white-space: nowrap; }
  .actions select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; cursor: pointer; background: var(--surface-2); color: var(--text);
    font-family: inherit;
  }
  .btn-arch {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; margin-left: 6px; cursor: pointer; font-size: 13px;
    color: var(--text-light); font-family: inherit; transition: .15s;
  }
  .btn-arch:hover { background: rgba(229,72,77,.1); border-color: rgba(229,72,77,.4); color: var(--red); }
  .btn-back {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; margin-left: 6px; cursor: pointer; font-size: 13px;
    color: var(--text-light); font-family: inherit; transition: .15s;
  }
  .btn-back:hover { background: rgba(62,207,142,.08); border-color: rgba(62,207,142,.35); color: var(--green); }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 40px; }

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(3px); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px;
    width: 640px; max-width: 92vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .modal h2 { font-size: 17px; margin-bottom: 18px; font-weight: 600; }
  .modal label { display: block; font-size: 12px; margin: 12px 0 5px; color: var(--text-light); }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(62,207,142,.12);
  }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .row2 { display: flex; gap: 12px; }
  .modal .row2 > div { flex: 1; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 22px; }
  .modal-buttons button {
    flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
    border: none; font-family: inherit; font-weight: 500; transition: .15s;
  }
  .btn-save { background: var(--green); color: var(--on-green); }
  .btn-save:hover { background: var(--green-hover); }
  .btn-cancel { background: var(--surface-2); color: var(--text-light); border: 1px solid var(--border) !important; }
  .btn-cancel:hover { background: var(--surface-3); color: var(--text); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ============ ОКНО ВХОДА ============ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>CRM — Сборка ПК</h1>
    <div class="sub">Вход в систему</div>
    <label for="loginEmail">Логин</label>
    <input id="loginEmail" type="text" placeholder="admin (или admin@star-comp.ru)" autocomplete="username">
    <label for="loginPass">Пароль</label>
    <input id="loginPass" type="password" placeholder="••••••" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button onclick="doLogin()">Войти</button>
    <button class="btn-signup" onclick="doSignup()">Создать аккаунт (регистрация)</button>
    <div class="login-hint">Вход: admin / admin1 &nbsp;•&nbsp; Данные в облаке — доступны с любого компьютера</div>
  </div>
</div>

<!-- ============ ОСНОВНОЕ ПРИЛОЖЕНИЕ ============ -->
<div id="app">
  <header>
    <div class="logo">CRM — <span>Сборка ПК</span></div>
    <div class="header-right">
      <button class="btn-logout" onclick="doLogout()">Выйти</button>
    </div>
  </header>

  <div class="container">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" id="tabOrders" onclick="switchTab('orders')">Заказы</button>
        <button class="tab-btn" id="tabArchive" onclick="switchTab('archive')">Архив</button>
        <button class="tab-btn" id="tabParts" onclick="switchTab('parts')">Железо</button>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span class="stats" id="stats"></span>
        <input type="search" id="partSearch" class="filter-input" placeholder="Поиск по названию..."
               list="partsDatalist" autocomplete="off" oninput="render()" style="display:none">
        <datalist id="partsDatalist"></datalist>
        <select class="filter-select" id="partFilter" onchange="render()"></select>
        <button class="btn-add" id="btnAddOrder" onclick="openAddModal()">+ Добавить заказ</button>
        <button class="btn-add" id="btnAddPart" style="display:none" onclick="openPartModal()">+ Добавить деталь</button>
      </div>
    </div>

    <div class="card">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============ МОДАЛКА ДЕТАЛИ (ЖЕЛЕЗО) ============ -->
<div class="modal-overlay" id="partOverlay">
  <div class="modal">
    <h2 id="partModalTitle">Новая деталь</h2>
    <label for="pCategory">Категория *</label>
    <select id="pCategory"></select>
    <label for="pName">Точное название *</label>
    <input id="pName" type="text" autocomplete="off" list="partsDatalist" placeholder="AMD Ryzen 7 7800X3D BOX">
    <label for="pPrice">Цена, ₽</label>
    <input id="pPrice" type="number" min="0" step="1" autocomplete="off" placeholder="35000">
    <label for="pLink">Ссылка на магазин</label>
    <input id="pLink" type="url" autocomplete="off" placeholder="https://...">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closePartModal()">Отмена</button>
      <button class="btn-save" onclick="savePart()">Сохранить</button>
    </div>
  </div>
</div>

<!-- ============ МЕНЮ ВЫБОРА СТАТУСА ============ -->
<div class="status-menu" id="statusMenu">
  <div class="menu-title">Изменить статус</div>
  <button class="menu-item" data-status="Согласование">🟡 Согласование</button>
  <button class="menu-item" data-status="В работе">🔵 В работе</button>
  <button class="menu-item" data-status="Закрыт">🟢 Закрыт (в архив)</button>
</div>

<!-- ============ МОДАЛКА ДОБАВЛЕНИЯ / РЕДАКТИРОВАНИЯ ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Новый заказ</h2>
    <label for="fNumber">Номер заказа</label>
    <input id="fNumber" type="text" name="orderNumber" autocomplete="off" placeholder="Например: 001">
    <label for="fDate">Дата</label>
    <input id="fDate" type="date" name="orderDate" autocomplete="off">
    <label for="fName">Имя заказчика *</label>
    <input id="fName" type="text" name="customerName" autocomplete="name" placeholder="Иван Иванов">
    <label for="fPhone">Номер телефона</label>
    <input id="fPhone" type="tel" name="customerPhone" autocomplete="tel" placeholder="+7 (___) ___-__-__">
    <label for="fLogin">Логин</label>
    <input id="fLogin" type="text" name="customerLogin" autocomplete="off" placeholder="логин заказчика">
    <label for="fSource">Источник</label>
    <input id="fSource" type="text" name="orderSource" autocomplete="off" placeholder="откуда пришёл клиент: Авито, ВК, знакомые...">
    <label>Конфигурация</label>
    <table class="config-table">
      <thead>
        <tr><th>Категория</th><th>Деталь</th><th>Стоимость, ₽</th></tr>
      </thead>
      <tbody id="configTableBody"></tbody>
    </table>
    <div class="config-sum" id="configSum"></div>
    <label for="fComment">Комментарий</label>
    <textarea id="fComment" name="comment" autocomplete="off" placeholder="Сборка ПК: RTX 4070, Ryzen 7..."></textarea>
    <label for="fStatus">Статус заказа</label>
    <select id="fStatus">
      <option value="Согласование">Согласование</option>
      <option value="В работе">В работе</option>
      <option value="Закрыт">Закрыт (в архив)</option>
    </select>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveOrder()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ================= ХРАНЕНИЕ ДАННЫХ =================
// Все данные хранятся в Supabase — облачной базе данных.
// Заказы, детали и счётчик номеров видны с любого компьютера после входа.
const SUPABASE_URL = 'https://ebpusmjozyyvdyhrwafk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVicHVzbWpvenl5dmR5aHJ3YWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjYzNjIsImV4cCI6MjExMDI0MjM2Mn0.sr4-Fw_7heJtIcF5ahM1tEIONDaUyOTdvmwbTKLGalU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null; // id заказа в режиме редактирования

let orders = [];   // активные заказы
let archived = []; // архив
let nextNum = 1;   // счётчик номеров заказов
let parts = [];    // комплектующие (вкладка «Железо»)

// старые localStorage-функции нужны только для разового переноса данных со старой версии
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; }
  catch { return def; }
}

async function loadAll() {
  const [o, p, s] = await Promise.all([
    sb.from('orders').select('*').order('id'),
    sb.from('parts').select('*').order('id'),
    sb.from('settings').select('*')
  ]);
  const oRows = o.data || [], pRows = p.data || [], sRows = s.data || [];
  if (o.error || p.error || s.error) {
    const e = (o.error || p.error || s.error);
    alert('Ошибка загрузки данных: ' + e.message);
  }
  orders = oRows.filter(x => !x.archived);
  archived = oRows.filter(x => x.archived);
  parts = pRows;
  const nn = sRows.find(x => x.key === 'nextnum');
  nextNum = nn ? (Number(nn.value) || 1) : 1;
}

// Разовый перенос данных из localStorage старой версии в облако
async function migrateLocalData() {
  const oldOrders = load('crm_orders', []);
  const oldArch = load('crm_archived', []);
  const oldParts = load('crm_parts', []);
  const oldNum = load('crm_nextnum', 1);
  if (!oldOrders.length && !oldArch.length && !oldParts.length) {
    ['crm_pass', 'crm_auth'].forEach(k => localStorage.removeItem(k));
    return;
  }
  const ok = confirm(
    'Найдены данные старой версии на этом компьютере:\n' +
    '• заказов: ' + (oldOrders.length + oldArch.length) + '\n' +
    '• деталей: ' + oldParts.length + '\n\n' +
    'Перенести их в облачную базу? (Нажмите «Отмена», чтобы удалить их без переноса)'
  );
  if (ok) {
    if (oldParts.length) {
      const { error } = await sb.from('parts').upsert(oldParts.map(x => ({
        id: x.id, category: x.category, name: x.name, price: x.price || 0, link: x.link || ''
      })));
      if (error) alert('Не удалось перенести детали: ' + error.message);
    }
    const allOld = oldOrders.map(x => ({ ...x, archived: false }))
      .concat(oldArch.map(x => ({ ...x, archived: true })));
    if (allOld.length) {
      const { error } = await sb.from('orders').upsert(allOld.map(x => ({
        id: x.id, number: x.number, date: x.date, name: x.name,
        phone: x.phone || '', login: x.login || '', comment: x.comment || '',
        config: x.config || [], status: x.status || 'Согласование', archived: x.archived
      })));
      if (error) alert('Не удалось перенести заказы: ' + error.message);
    }
    await sb.from('settings').upsert({ key: 'nextnum', value: Number(oldNum) || 1 });
  }
  ['crm_orders', 'crm_archived', 'crm_parts', 'crm_nextnum', 'crm_pass', 'crm_auth']
    .forEach(k => localStorage.removeItem(k));
}

// ================= КОПИРОВАНИЕ ЗАКАЗА В БУФЕР ОБМЕНА =================
function copyOrder(id, btn) {
  const o = orders.find(x => x.id === id) || archived.find(x => x.id === id);
  if (!o) return;

  const lines = [];
  lines.push('Заказ №' + o.number + ' от ' + fmtDate(o.date));
  lines.push('Статус: ' + o.status);
  if (o.name) lines.push('Заказчик: ' + o.name);
  if (o.phone) lines.push('Телефон: ' + o.phone);
  if (o.login) lines.push('Логин: ' + o.login);

  const cfg = o.config || [];
  if (cfg.length) {
    lines.push('');
    lines.push('Конфигурация:');
    let total = 0;
    cfg.forEach(c => {
      const qty = (c.qty || 1);
      const qtyTxt = qty > 1 ? ' ×' + qty : '';
      const price = (c.price || 0) * qty;
      total += price;
      lines.push('• ' + c.category + ': ' + c.name + qtyTxt + ' — ' + price.toLocaleString('ru-RU') + ' ₽');
    });
    if (total > 0) lines.push('Сумма: ' + total.toLocaleString('ru-RU') + ' ₽');
  }

  if (o.comment) {
    lines.push('');
    lines.push('Комментарий: ' + o.comment);
  }

  const text = lines.join('\n');
  const done = () => {
    if (!btn) { alert('✓ Заказ №' + o.number + ' скопирован в буфер обмена'); return; }
    const old = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = old; }, 1200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    cb();
  } catch (e) {
    alert('Не удалось скопировать автоматически — выделите текст вручную');
  }
  ta.remove();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return day + '.' + m + '.' + y;
}

// нормализация названия для поиска дублей: регистр, порядок слов и знаки не важны
function normName(s) {
  return String(s).toLowerCase()
    .replace(/[^a-zа-яё0-9+]+/gi, ' ')
    .trim()
    .split(' ')
    .filter(Boolean)
    .sort()
    .join(' ');
}

async function savePart() {
  const name = document.getElementById('pName').value.trim();
  if (!name) { alert('Укажите точное название детали'); return; }

  // проверка на дубли: совпадение даже при другом порядке слов и написании
  const nn = normName(name);
  const dup = parts.find(x => x.id !== partEditId && normName(x.name) === nn);
  if (dup && !confirm('Похоже, такая деталь уже есть в базе:\n«' + dup.name + '» (' + dup.category + ')\n\nВсё равно добавить?')) {
    return;
  }

  const row = {
    category: document.getElementById('pCategory').value,
    name: name,
    price: parseFloat(document.getElementById('pPrice').value) || 0,
    link: document.getElementById('pLink').value.trim()
  };
  if (partEditId) {
    const { data, error } = await sb.from('parts').update(row).eq('id', partEditId).select().single();
    if (error) { alert('Ошибка сохранения: ' + error.message); return; }
    parts = parts.map(x => x.id === data.id ? data : x);
  } else {
    const { data, error } = await sb.from('parts').insert(row).select().single();
    if (error) { alert('Ошибка сохранения: ' + error.message); return; }
    parts.push(data);
  }
  closePartModal();
  render();
}

async function deletePart(id) {
  const p = parts.find(x => x.id === id);
  if (!p) return;
  if (!confirm('Удалить деталь «' + p.name + '»?')) return;
  const { error } = await sb.from('parts').delete().eq('id', id);
  if (error) { alert('Ошибка удаления: ' + error.message); return; }
  parts = parts.filter(x => x.id !== id);
  render();
}

// ================= КОНФИГУРАЦИЯ В ЗАКАЗЕ (СТАТИЧНАЯ ТАБЛИЦА) =================
// Первый столбец — фиксированные строки, второй — деталь из базы «Железо»,
// третий — стоимость вручную. Внизу сумма всех стоимостей.
const CONFIG_LINES = [
  { label: 'Процессор',          cats: ['Процессор'] },
  { label: 'Видеокарта',         cats: ['Видеокарта'] },
  { label: 'Материнская плата',  cats: ['Материнская плата'] },
  { label: 'Оперативная память', cats: ['Оперативная память'] },
  { label: 'Накопитель',         cats: ['Накопитель'] },
  { label: 'Накопитель 2',       cats: ['Накопитель'] },
  { label: 'Охлаждение',         cats: ['Воздушное охлаждение', 'Жидкостное охлаждение'] },
  { label: 'Блок питания',       cats: ['Блок питания'] },
  { label: 'Корпус',             cats: ['Корпус'] },
  { label: 'Вентиляторы',        cats: ['Вентилятор'] }
];

function buildConfigTable(savedList) {
  savedList = savedList || [];
  const pending = savedList.slice(); // не распределённые сохранённые позиции
  const tbody = document.getElementById('configTableBody');
  tbody.innerHTML = '';

  CONFIG_LINES.forEach(line => {
    // сначала ищем сохранённую позицию именно этой строки, затем — по категориям старых заказов
    let idx = pending.findIndex(it => it.line === line.label);
    if (idx === -1) idx = pending.findIndex(it => line.cats.includes(it.category));
    let saved = null;
    if (idx !== -1) { saved = pending[idx]; pending.splice(idx, 1); }

    const tr = document.createElement('tr');

    const tdLabel = document.createElement('td');
    tdLabel.className = 'config-line';
    tdLabel.textContent = line.label + ':';

    const tdSel = document.createElement('td');
    const sel = document.createElement('select');
    sel.className = 'config-part';

    const tdCost = document.createElement('td');
    const cost = document.createElement('input');
    cost.type = 'number';
    cost.className = 'config-cost';
    cost.min = '0';
    cost.step = '1';
    cost.placeholder = '—';

    function fillParts() {
      const list = parts.filter(p => line.cats.includes(p.category));
      let html = '<option value="">— не выбрано —</option>';
      list.forEach(p => {
        html += '<option value="' + p.id + '">' + esc(p.name) + '</option>';
      });
      // деталь удалена из каталога после сохранения заказа — показываем снимок
      if (saved && saved.partId && !list.some(p => String(p.id) === String(saved.partId))) {
        html += '<option value="' + esc(saved.partId) + '">' + esc(saved.name) + ' (нет в каталоге)</option>';
      }
      sel.innerHTML = html;
      if (saved && saved.partId) sel.value = String(saved.partId);
    }

    if (saved && saved.price) cost.value = saved.price;
    fillParts();

    sel.onchange = updateConfigSum;
    cost.oninput = updateConfigSum;

    tdSel.appendChild(sel);
    tdCost.appendChild(cost);
    tr.appendChild(tdLabel);
    tr.appendChild(tdSel);
    tr.appendChild(tdCost);
    tbody.appendChild(tr);
  });
}

function rowCost(tr) {
  const costEl = tr.querySelector('.config-cost');
  return Math.max(0, Number(costEl && costEl.value) || 0);
}

function fmtMoney(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

function updateConfigSum() {
  let sum = 0, any = false;
  document.querySelectorAll('#configTableBody tr').forEach(tr => {
    const c = rowCost(tr);
    if (c > 0) { sum += c; any = true; }
  });
  document.getElementById('configSum').textContent =
    any ? 'Сумма конфигурации: ' + fmtMoney(sum) : '';
}

function collectConfig() {
  const out = [];
  document.querySelectorAll('#configTableBody tr').forEach((tr, i) => {
    const line = CONFIG_LINES[i];
    const sel = tr.querySelector('.config-part');
    const cost = rowCost(tr);
    if (!sel.value && !cost) return;
    const opt = sel.selectedOptions[0];
    const p = parts.find(x => String(x.id) === String(sel.value));
    out.push({
      line: line.label,
      category: line.label,
      partId: sel.value || '',
      name: sel.value ? (p ? p.name : opt.textContent.replace(' (нет в каталоге)', '')) : '',
      price: cost,
      qty: 1
    });
  });
  return out;
}

function resetConfigRows(list) {
  buildConfigTable(list || []);
  updateConfigSum();
}

let menuOrderId = null;

function openStatusMenu(e, id) {
  e.stopPropagation();
  menuOrderId = id;
  const inOrders = orders.some(x => x.id === id);
  const o = (inOrders ? orders : archived).find(x => x.id === id);
  if (!o) return;

  const menu = document.getElementById('statusMenu');
  menu.querySelectorAll('.menu-item').forEach(item => {
    item.classList.toggle('current', item.dataset.status === o.status);
  });

  // показываем меню рядом с бейджиком
  menu.classList.add('open');
  const rect = e.target.getBoundingClientRect();
  const mw = 200, mh = 130;
  let x = rect.left, y = rect.bottom + 4;
  if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight) y = rect.top - mh - 4;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function closeStatusMenu() {
  document.getElementById('statusMenu').classList.remove('open');
  menuOrderId = null;
}

async function applyStatus(id, status) {
  let o = orders.find(x => x.id === id);
  let fromArchive = false;
  if (!o) { o = archived.find(x => x.id === id); fromArchive = true; }
  if (!o) { closeStatusMenu(); return; }

  const toArchive = status === 'Закрыт';
  const { error } = await sb.from('orders').update({ status: status, archived: toArchive }).eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); closeStatusMenu(); return; }

  o.status = status;
  if (fromArchive) {
    // из архива: любой статус кроме «Закрыт» возвращает заказ в работу
    if (!toArchive) {
      archived = archived.filter(x => x.id !== id);
      orders.push(o);
    }
  } else if (toArchive) {
    // закрытые автоматически уходят в архив
    orders = orders.filter(x => x.id !== id);
    archived.push(o);
  }
  closeStatusMenu();
  render();
}

// клик по пункту меню
document.querySelectorAll('#statusMenu .menu-item').forEach(item => {
  item.addEventListener('click', () => {
    if (menuOrderId != null) applyStatus(menuOrderId, item.dataset.status);
  });
});
// закрытие меню по клику вне его
document.addEventListener('click', e => {
  const menu = document.getElementById('statusMenu');
  if (menu.classList.contains('open') && !menu.contains(e.target)) closeStatusMenu();
});

// ================= ДЕЙСТВИЯ =================
// смена статуса, архив и восстановление — всё через меню статуса
// (клик по бейджу статуса в таблице), см. applyStatus()

// ================= МОДАЛКА =================
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Новый заказ';
  // Номер подставляется автоматически
  document.getElementById('fNumber').value = String(nextNum).padStart(3, '0');
  // Дата подставляется автоматически (сегодня)
  document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fLogin').value = '';
  document.getElementById('fSource').value = '';
  document.getElementById('fComment').value = '';
  resetConfigRows();
  document.getElementById('fStatus').value = 'Согласование';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('fName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

async function saveOrder() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Укажите имя заказчика'); return; }

  const row = {
    number: document.getElementById('fNumber').value.trim() || String(nextNum).padStart(3, '0'),
    date: document.getElementById('fDate').value,
    name: name,
    phone: document.getElementById('fPhone').value.trim(),
    login: document.getElementById('fLogin').value.trim(),
    source: document.getElementById('fSource').value.trim(),
    comment: document.getElementById('fComment').value.trim(),
    config: collectConfig(),
    status: document.getElementById('fStatus').value
  };
  const closed = row.status === 'Закрыт';

  async function write(withSource) {
    const p = withSource ? row : (() => { const c = { ...row }; delete c.source; return c; })();
    if (editingId) {
      return sb.from('orders').update({ ...p, archived: closed }).eq('id', editingId).select().single();
    }
    return sb.from('orders').insert(p).select().single();
  }

  let saved;
  // сначала пробуем сохранить с «Источником»; если в таблице ещё нет колонки source — повторяем без него
  let res = await write(true);
  if (res.error && /source/i.test(res.error.message || '')) {
    console.warn('Колонка source отсутствует в таблице orders — «Источник» не сохранён в облако');
    res = await write(false);
  }
  if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
  saved = res.data;

  if (editingId) {
    orders = orders.filter(x => x.id !== saved.id);
    archived = archived.filter(x => x.id !== saved.id);
  }

  (closed ? archived : orders).push(saved);

  // счётчик номеров растёт при занятом номере
  const usedNum = parseInt(saved.number, 10);
  if (!isNaN(usedNum) && usedNum >= nextNum) {
    nextNum = usedNum + 1;
    sb.from('settings').upsert({ key: 'nextnum', value: nextNum }).then(() => {});
  }

  editingId = null;
  closeModal();
  if (currentTab !== 'orders') switchTab('orders'); else render();
}

// закрытие модалки по клику на фон и по Escape
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeStatusMenu(); closeModal(); closePartModal(); }
});

// ================= АВТОВХОД =================
// если пользователь уже входил (сессия сохранена) — открываем приложение сразу
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) await enterApp();
})();
</script>
