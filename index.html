<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM-STARCOMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --surface: #171717;
    --surface-2: #1f1f1f;
    --surface-3: #262626;
    --border: #2e2e2e;
    --border-soft: #232323;
    --text: #ededed;
    --text-light: #a0a0ab;
    --text-muted: #6e6e78;
    --green: #3ecf8e;
    --green-hover: #4fd39b;
    --green-dark: #249361;
    --on-green: #101511;
    --amber: #f4a72c;
    --blue: #4d9fff;
    --red: #e5484d;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== ОКНО ВХОДА ===== */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(62,207,142,.16), transparent 60%),
      radial-gradient(700px 340px at 85% 110%, rgba(36,147,97,.13), transparent 60%),
      var(--bg);
  }
  .login-box {
    background: rgba(23,23,23,.92);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
    width: 380px;
    backdrop-filter: blur(8px);
  }
  .login-box h1 { font-size: 21px; text-align: center; margin-bottom: 6px; font-weight: 600; letter-spacing: -.01em; }
  .login-box .sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .login-box label { display: block; font-size: 12px; margin: 14px 0 6px; color: var(--text-light); }
  .login-box input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .login-box input:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(62,207,142,.15);
  }
  .login-box button {
    width: 100%; margin-top: 20px; padding: 10px;
    background: var(--green); color: var(--on-green); border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .login-box button:hover { background: var(--green-hover); }
  .login-error { color: #ff8f8f; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

  /* ===== ШАПКА ===== */
  #app { display: none; }
  header {
    background: rgba(23,23,23,.85);
    backdrop-filter: blur(10px);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header .logo { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  header .logo span { color: var(--green); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .btn-logout {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text-light);
    font-family: inherit; transition: .15s;
  }
  .btn-logout:hover { background: var(--surface-2); color: var(--text); }

  /* ===== КОНТЕНТ ===== */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 28px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .tabs {
    display: flex; gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px;
  }
  .tab-btn {
    padding: 7px 18px; border: none; border-radius: 7px; cursor: pointer;
    font-size: 13px; background: transparent; color: var(--text-light);
    font-family: inherit; transition: .15s;
  }
  .tab-btn.active { background: var(--green); color: var(--on-green); font-weight: 500; }
  .tab-btn:not(.active):hover { background: var(--surface-2); color: var(--text); }
  .btn-add {
    background: var(--green); color: var(--on-green); border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .btn-add:hover { background: var(--green-hover); }
  /* компактная зелёная кнопка «+» для добавления заказа/детали (текст только в подсказке) */
  .btn-part-full { display: none; }
  .btn-part-plus { display: inline; font-size: 16px; line-height: 1; }
  #btnAddOrder, #btnAddPart { padding: 7px 13px; }
  .stats { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  .filter-select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; cursor: pointer; background: var(--surface-2);
    color: var(--text); display: none; font-family: inherit;
  }
  .filter-input {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--surface-2); color: var(--text);
    display: none; font-family: inherit; width: 220px;
  }
  .filter-input::placeholder { color: var(--text-muted); }
  .filter-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(62,207,142,.12); }
  .shop-link { color: var(--green); text-decoration: none; font-size: 13px; }
  .shop-link:hover { text-decoration: underline; }
  .cust-name { font-weight: 500; }
  .cust-phone { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cust-login { font-size: 12px; color: var(--text-light); margin-top: 2px; font-style: italic; }
  .order-cost { font-family: var(--mono); font-size: 13px; white-space: nowrap; color: var(--text); }

  /* ===== КОНФИГУРАЦИЯ В ЗАКАЗЕ (СТАТИЧНАЯ ТАБЛИЦА) ===== */
  .config-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .config-table th {
    text-align: left; font-size: 11px; color: var(--text-muted);
    padding: 4px 8px 6px; border-bottom: 1px solid var(--border);
    font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  }
  .config-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .config-table tr:last-child td { border-bottom: none; }
  .config-line { font-size: 13px; color: var(--text); white-space: nowrap; width: 34%; }
  .config-table .config-part { width: 100%; min-width: 0; }
  .config-table .config-cost { width: 100%; min-width: 0; }
  .config-table select, .config-table input {
    padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
  }
  .config-table select:focus, .config-table input:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(62,207,142,.12);
  }
  .config-cost::placeholder { color: var(--text-muted); }
  .config-sum {
    font-weight: 600; font-size: 13px; color: var(--text);
    margin-top: 10px; min-height: 18px; font-family: var(--mono);
  }
  .config-profit { color: var(--green); }

  /* ===== НЕСКОЛЬКО КОНФИГУРАЦИЙ В ЗАКАЗЕ ===== */
  .config-block {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px 10px; margin-top: 8px;
  }
  .config-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .config-block-title {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px; color: var(--text);
    cursor: pointer; user-select: none;
  }
  .config-block-title input[type="checkbox"] {
    width: auto !important; margin: 0; accent-color: var(--green); cursor: pointer;
  }
  .config-block-title:hover { color: var(--green); }
  .config-block-tools { display: flex; gap: 4px; }
  .config-collapse, .config-block-del {
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--text-muted); font-size: 12px; padding: 2px 6px; border-radius: 6px;
    transition: .15s;
  }
  .config-collapse:hover { color: var(--text); background: var(--surface-3); }
  .config-block-del:hover { color: var(--red); background: rgba(229,72,77,.12); }
  .config-block.collapsed .config-block-body { display: none; }
  .config-block .config-table { margin-top: 2px; }
  .btn-config-add {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text-light);
    font-family: inherit; margin-top: 10px; transition: .15s;
  }
  .btn-config-add:hover { background: var(--surface-3); color: var(--text); }

  /* ===== КНОПКА КОПИРОВАНИЯ ЗАКАЗА ===== */
  .num-wrap { display: flex; align-items: center; gap: 6px; }
  .btn-copy {
    background: none; border: none; cursor: pointer;
    font-size: 14px; padding: 0 2px; line-height: 1; color: var(--text-muted);
    transition: color .15s, transform .15s;
  }
  .btn-copy:hover { transform: scale(1.2); color: var(--green); }

  /* ===== ТАБЛИЦА ===== */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; padding: 12px 14px;
    color: var(--text-muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; font-weight: 500; font-family: var(--mono);
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,.02);
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(62,207,142,.03); }
  .order-num {
    font-weight: 600; color: var(--green); cursor: pointer;
    text-decoration: none; border-bottom: 1px dashed rgba(62,207,142,.4);
  }
  .order-num:hover { color: var(--green-hover); border-bottom-style: solid; }

  /* ===== МЕНЮ ВЫБОРА СТАТУСА ===== */
  .status-menu {
    display: none; position: fixed; z-index: 200;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); min-width: 190px;
  }
  .status-menu.open { display: block; }
  .status-menu .menu-title {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    padding: 6px 10px 4px; letter-spacing: .1em; font-family: var(--mono);
  }
  .status-menu .menu-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: none; background: none;
    border-radius: 7px; cursor: pointer; font-size: 13px;
    color: var(--text); font-family: inherit; transition: .12s;
  }
  .status-menu .menu-item:hover { background: var(--surface-2); }
  .status-menu .menu-item.current { font-weight: 600; color: var(--green); }
  .status-menu .menu-item.current::after { content: ' ✓'; }
  .order-date { color: var(--text-muted); font-size: 11px; font-family: var(--mono); }
  .comment-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-light); }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
    border: 1px solid transparent; transition: filter .15s;
  }
  .badge:hover { filter: brightness(1.15); }
  .badge.soglasovanie { background: rgba(244,167,44,.12); color: var(--amber); border-color: rgba(244,167,44,.28); }
  .badge.vrabote      { background: rgba(77,159,255,.12); color: var(--blue); border-color: rgba(77,159,255,.28); }
  .badge.zakryt       { background: rgba(62,207,142,.12); color: var(--green); border-color: rgba(62,207,142,.28); }

  .actions { white-space: nowrap; }
  .actions select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; cursor: pointer; background: var(--surface-2); color: var(--text);
    font-family: inherit;
  }
  .btn-arch {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; margin-left: 6px; cursor: pointer; font-size: 13px;
    color: var(--text-light); font-family: inherit; transition: .15s;
  }
  .btn-arch:hover { background: rgba(229,72,77,.1); border-color: rgba(229,72,77,.4); color: var(--red); }
  .btn-back {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; margin-left: 6px; cursor: pointer; font-size: 13px;
    color: var(--text-light); font-family: inherit; transition: .15s;
  }
  .btn-back:hover { background: rgba(62,207,142,.08); border-color: rgba(62,207,142,.35); color: var(--green); }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 40px; }

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(3px); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px;
    width: 640px; max-width: 92vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .modal h2 { font-size: 17px; margin-bottom: 18px; font-weight: 600; }
  .modal label { display: block; font-size: 12px; margin: 12px 0 5px; color: var(--text-light); }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--surface-2); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(62,207,142,.12);
  }
  .modal textarea { resize: vertical; min-height: 140px; }
  .number-row { display: flex; gap: 12px; align-items: center; }
  .number-row #fNumber { flex: 1; min-width: 0; }
  .manual-check {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none;
  }
  .manual-check input[type="checkbox"] {
    width: auto !important; margin: 0; accent-color: var(--green);
    cursor: pointer;
  }
  .manual-check:hover { color: var(--text); }
  .modal .row2 { display: flex; gap: 12px; }
  .modal .row2 > div { flex: 1; }
  .form-section { border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
  .form-section:first-of-type { margin-top: 0; }
  .section-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--surface-2); border: none; color: var(--text);
    font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; text-align: left;
  }
  .section-toggle:hover { background: var(--surface-3); }
  .section-toggle::after { content: '▾'; color: var(--text-muted); font-size: 12px; transition: transform .15s; }
  .form-section.collapsed .section-toggle::after { transform: rotate(-90deg); }
  .section-body { padding: 0 12px 12px; }
  .section-body > label:first-child { margin-top: 8px; }
  .form-section.collapsed .section-body { display: none; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 22px; }
  .modal-buttons button {
    flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
    border: none; font-family: inherit; font-weight: 500; transition: .15s;
  }
  .btn-save { background: var(--green); color: var(--on-green); }
  .btn-save:hover { background: var(--green-hover); }
  .btn-cancel { background: var(--surface-2); color: var(--text-light); border: 1px solid var(--border) !important; }
  .btn-cancel:hover { background: var(--surface-3); color: var(--text); }

  /* ===== СКЛАД ===== */
  .stock-rel-list { max-height: 170px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; padding: 4px; background: var(--bg); }
  .stock-rel-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .stock-rel-item:hover { background: var(--surface-2); }
  .stock-rel-item input[type="checkbox"] { width: auto !important; margin: 0; accent-color: var(--green); }
  .stock-rel-empty { color: var(--text-muted); font-size: 12px; padding: 8px; }
  .stock-selected { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stock-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); font-size: 12px; }
  .stock-chip button { border: 0; background: none; color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer; }
  .stock-chip button:hover { color: var(--red); }
  .stock-file-label { margin-top: 12px !important; }
  .stock-files { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .stock-file { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .stock-file a { color: var(--green); text-decoration: underline; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stock-file-size { color: var(--text-muted); font-size: 12px; }
  .stock-file button { margin-left: auto; border: 0; background: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
  .stock-file button:hover { color: var(--red); }
  .stock-suggest-wrap { position: relative; }
  .stock-suggest {
    display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px;
    max-height: 220px; overflow-y: auto; margin-top: 3px;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .stock-suggest.open { display: block; }
  .stock-suggest-item { padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .stock-suggest-item:hover, .stock-suggest-item.active { background: var(--surface-2); color: var(--green); }
  .stock-suggest-empty { color: var(--text-muted); font-size: 12px; padding: 10px; }
  .stock-suggest mark { background: rgba(62,207,142,.25); color: var(--green); border-radius: 2px; }
  .stock-actions { display: none; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .stock-selected-count { color: var(--text-light); font-size: 13px; }
  .btn-stock-act { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer; }
  .btn-stock-act:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .btn-stock-act.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .btn-stock-act:disabled { opacity: .4; cursor: not-allowed; }
  .stock-check { width: auto !important; margin: 0; accent-color: var(--green); }
  .stock-hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; min-height: 15px; }
  .stock-more { margin-top: 8px; border: 1px solid var(--border-soft); border-radius: 8px; padding: 5px 10px; background: var(--bg); }
  .stock-more[open] { border-color: var(--border); }
  .stock-more summary { cursor: pointer; color: var(--text-light); font-size: 13px; list-style: none; padding: 4px 0; }
  .stock-more summary::-webkit-details-marker { display: none; }
  .stock-more summary::before { content: '▸ '; color: var(--green); }
  .stock-more[open] summary::before { content: '▾ '; }
  .stock-more summary:hover { color: var(--green); }

  /* ===== МОБИЛЬНАЯ ВЕРСИЯ ===== */
  @media (max-width: 640px) {
    /* статистику (активных, согласование, в работе) не показываем */
    .stats { display: none; }
    /* компактная кнопка «Добавить заказ» */
    .btn-add { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
    /* таблица прокручивается пальцем вправо */
    .card { overflow-x: auto; }
    .card table { min-width: 760px; }
    .container { padding: 14px 10px; }
    header { padding: 10px 12px; }
    .modal { padding: 20px 16px; }
    /* поле дата не вылезает за экран: модалка на всю ширину, дата сжимается */
    .modal { width: calc(100vw - 16px); max-width: calc(100vw - 16px); }
    .modal input, .modal select, .modal textarea { min-width: 0; }
    .modal input[type="date"] {

<script>
// ================= ХРАНЕНИЕ ДАННЫХ =================
// Все данные хранятся в Supabase — облачной базе данных.
// Заказы, детали и счётчик номеров видны с любого компьютера после входа.
const SUPABASE_URL = 'https://ebpusmjozyyvdyhrwafk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVicHVzbWpvenl5dmR5aHJ3YWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjYzNjIsImV4cCI6MjExMDI0MjM2Mn0.sr4-Fw_7heJtIcF5ahM1tEIONDaUyOTdvmwbTKLGalU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null; // id заказа в режиме редактирования

let orders = [];   // активные заказы
let archived = []; // архив
let nextNum = 1;   // счётчик номеров заказов
let parts = [];    // комплектующие (вкладка «Железо»)

// старые localStorage-функции нужны только для разового переноса данных со старой версии
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; }
  catch { return def; }
}

async function loadAll() {
  const [o, p, s] = await Promise.all([
    sb.from('orders').select('*').order('id'),
    sb.from('parts').select('*').order('id'),
    sb.from('settings').select('*')
  ]);
  const oRows = o.data || [], pRows = p.data || [], sRows = s.data || [];
  if (o.error || p.error || s.error) {
    const e = (o.error || p.error || s.error);
    alert('Ошибка загрузки данных: ' + e.message);
  }
  orders = oRows.filter(x => !x.archived);
  archived = oRows.filter(x => x.archived);
  parts = pRows;
  const nn = sRows.find(x => x.key === 'nextnum');
  nextNum = nn ? (Number(nn.value) || 1) : 1;
  const sr = sRows.find(x => x.key === 'stock_items');
  stock = parseStockValue(sr && sr.value);
}

// Разовый перенос данных из localStorage старой версии в облако
async function migrateLocalData() {
  const oldOrders = load('crm_orders', []);
  const oldArch = load('crm_archived', []);
  const oldParts = load('crm_parts', []);
  const oldNum = load('crm_nextnum', 1);
  if (!oldOrders.length && !oldArch.length && !oldParts.length) {
    ['crm_pass', 'crm_auth'].forEach(k => localStorage.removeItem(k));
    return;
  }
  const ok = confirm(
    'Найдены данные старой версии на этом компьютере:\n' +
    '• заказов: ' + (oldOrders.length + oldArch.length) + '\n' +
    '• деталей: ' + oldParts.length + '\n\n' +
    'Перенести их в облачную базу? (Нажмите «Отмена», чтобы удалить их без переноса)'
  );
  if (ok) {
    if (oldParts.length) {
      const { error } = await sb.from('parts').upsert(oldParts.map(x => ({
        id: x.id, category: x.category, name: x.name, price: x.price || 0, link: x.link || ''
      })));
      if (error) alert('Не удалось перенести детали: ' + error.message);
    }
    const allOld = oldOrders.map(x => ({ ...x, archived: false }))
      .concat(oldArch.map(x => ({ ...x, archived: true })));
    if (allOld.length) {
      const { error } = await sb.from('orders').upsert(allOld.map(x => ({
        id: x.id, number: x.number, date: x.date, name: x.name,
        phone: x.phone || '', login: x.login || '', comment: x.comment || '',
        config: x.config || [], status: x.status || 'Согласование', archived: x.archived
      })));
      if (error) alert('Не удалось перенести заказы: ' + error.message);
    }
    await sb.from('settings').upsert({ key: 'nextnum', value: Number(oldNum) || 1 });
  }
  ['crm_orders', 'crm_archived', 'crm_parts', 'crm_nextnum', 'crm_pass', 'crm_auth']
    .forEach(k => localStorage.removeItem(k));
}

// ================= ВХОД =================
// Логины-алиасы: можно входить коротким именем без email
const LOGIN_ALIASES = {
  'igor': 'igor@star-comp.ru',
  'admin': 'admin@star-comp.ru'
};

function normalizeEmail(v) {
  const key = v.toLowerCase();
  return LOGIN_ALIASES[key] || v;
}

async function doLogin() {
  const email = normalizeEmail(document.getElementById('loginEmail').value.trim());
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  if (!email || !pass) {
    document.getElementById('loginError').textContent = 'Введите логин и пароль';
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    document.getElementById('loginError').textContent = 'Неверный логин или пароль';
    return;
  }
  await enterApp();
}
async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}
let currentUserLabelStr = '';
let originalOrderComment = '';

function userLabelFromSession(session) {
  const u = session && session.user;
  if (!u) return '';
  const email = (u.email || '').toLowerCase();
  if (email === 'igor@star-comp.ru') return 'igor';
  if (email === 'admin@star-comp.ru') return 'admin';
  return u.email || (u.user_metadata && (u.user_metadata.login || u.user_metadata.name)) || 'user';
}

async function refreshCurrentUserLabel() {
  try {
    const { data } = await sb.auth.getSession();
    currentUserLabelStr = userLabelFromSession(data && data.session);
  } catch (e) { currentUserLabelStr = currentUserLabelStr || ''; }
  return currentUserLabelStr;
}

function commentStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ts = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  return '[' + ts + ', ' + (currentUserLabelStr || 'user') + ']';
}

function toggleOrderSection(btn) {
  const sec = btn && btn.closest ? btn.closest('.form-section') : null;
  if (sec) sec.classList.toggle('collapsed');
}

function setOrderSectionsCollapsed(collapsed) {
  document.querySelectorAll('#modalOverlay .form-section').forEach(sec => {
    sec.classList.toggle('collapsed', !!collapsed);
  });
}

function applyCommentStampOnSave() {
  const current = document.getElementById('fComment').value.replace(/\s+$/, '');
  const orig = (originalOrderComment || '').replace(/\s+$/, '');
  if (!current.trim()) return '';
  if (current === orig) return orig;
  const stamp = commentStamp();
  if (!orig) return stamp + '\n' + current.trim();
  if (current.indexOf(orig) === 0) {
    const added = current.slice(orig.length).replace(/^\n+/, '').trim();
    if (!added) return orig;
    return orig + '\n\n' + stamp + '\n' + added;
  }
  // текст изменён не в конце истории — дописываем новую пометку с текущим текстом
  return orig + '\n\n' + stamp + '\n' + current.trim();
}

async function enterApp() {
  // полностью удаляем форму входа со страницы — иначе браузер (Chrome)
  // считает поля формы заказа частью формы логина и предлагает автозаполнение «Логин»
  const login = document.getElementById('loginScreen');
  if (login) login.remove();
  document.getElementById('app').style.display = 'block';
  await refreshCurrentUserLabel();
  updateAdminUI();
  await migrateLocalData();
  await loadAll();
  render();
}

// ================= ВКЛАДКИ =================
let currentTab = 'orders';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
  document.getElementById('tabArchive').classList.toggle('active', tab === 'archive');
  document.getElementById('tabParts').classList.toggle('active', tab === 'parts');
  document.getElementById('tabStock').classList.toggle('active', tab === 'stock');
  const isParts = tab === 'parts';
  const isStock = tab === 'stock' && isAdmin();
  document.getElementById('partFilter').style.display = isParts ? 'inline-block' : 'none';
  document.getElementById('partSearch').style.display = isParts ? 'inline-block' : 'none';
  document.getElementById('btnAddOrder').style.display = (isParts || isStock) ? 'none' : 'inline-block';
  document.getElementById('btnAddPart').style.display = isParts ? 'inline-block' : 'none';
  document.getElementById('btnAddStock').style.display = isStock ? 'inline-block' : 'none';
  document.getElementById('stockActions').style.display = isStock ? 'flex' : 'none';
  document.getElementById('stats').style.display = isStock ? 'none' : '';
  if (!isStock) stockSelected.clear();
  render();
}

// ================= ОТРИСОВКА =================
function statusBadge(status) {
  const cls = { 'Согласование': 'soglasovanie', 'В работе': 'vrabote', 'Закрыт': 'zakryt' }[status] || '';
  return '<span class="badge ' + cls + '">' + status + '</span>';
}

const ORDERS_HEAD = '<tr>' +
  '<th>№ заказа</th><th>Статус</th><th>Заказчик</th><th>Стоимость</th>' +
  '<th>Комментарий</th></tr>';

// стоимость на главной = сумма ВСЕХ отмеченных конфигураций (галочки в карточке);
// если отмечено несколько — складываются (например, заказ на 2 компьютера)
function configTotal(o) {
  const blocks = normalizeConfigBlocks(o.config);
  if (!blocks) return 0;
  const sel = blocks.filter(b => b.selected);
  if (!sel.length) return 0;
  return sel.reduce((s, b) => s + itemsTotal(b.items), 0);
}

function render() {
  if (currentTab === 'parts') { renderParts(); return; }
  if (currentTab === 'stock') { renderStock(); return; }
  document.getElementById('tableHead').innerHTML = ORDERS_HEAD;
  const isArchive = currentTab === 'archive';
  // сортировка по номеру заказа: чем больше номер, тем выше в списке
  const data = (isArchive ? archived : orders).slice().sort((a, b) => {
    const na = parseInt(a.number, 10);
    const nb = parseInt(b.number, 10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
    // нечисловые номера — сравниваем как строки (по убыванию), при равенстве — по дате
    const byNum = String(b.number).localeCompare(String(a.number), 'ru', { numeric: true });
    if (byNum !== 0) return byNum;
    return String(b.date || '').localeCompare(String(a.date || ''));
  });
  const tbody = document.getElementById('tableBody');
  document.getElementById('stats').textContent =
    isArchive
      ? 'Заказов в архиве: ' + archived.length
      : 'Активных заказов: ' + orders.length +
        ' | Согласование: ' + orders.filter(o => o.status === 'Согласование').length +
        ' | В работе: ' + orders.filter(o => o.status === 'В работе').length;

  if (data.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">' +
      (isArchive ? 'Архив пуст' : 'Заказов пока нет — нажмите «+ Добавить заказ»') + '</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(o => {
    const total = configTotal(o);
    return '<tr>' +
      '<td><div class="num-wrap"><a class="order-num" title="Открыть карточку заказа" onclick="openOrderCard(' + o.id + ')">' + esc(o.number) + '</a>' +
        '<button class="btn-copy" title="Скопировать заказ текстом (для мессенджера)" onclick="copyOrder(' + o.id + ', this)">💾</button></div>' +
        '<div class="order-date">' + esc(fmtDate(o.date)) + '</div></td>' +
      '<td>' + statusBadge(o.status, o.id) + '</td>' +
      '<td><div class="cust-name">' + esc(o.name) + '</div>' +
        '<div class="cust-phone">' + esc(o.phone) + '</div>' +
        (o.login ? '<div class="cust-login">@' + esc(o.login) + '</div>' : '') + '</td>' +
      '<td class="order-cost">' + (total > 0 ? fmtMoney(total) : '—') + '</td>' +
      '<td class="comment-cell" title="' + esc(o.comment) + '">' + esc(o.comment) + '</td>' +
    '</tr>';
  }).join('');
}

function statusBadge(status, id) {
  const cls = { 'Согласование': 'soglasovanie', 'В работе': 'vrabote', 'Закрыт': 'zakryt' }[status] || '';
  return '<span class="badge ' + cls + '" title="Нажмите, чтобы сменить статус" onclick="openStatusMenu(event, ' + id + ')">' + status + '</span>';
}

// ================= КОПИРОВАНИЕ ЗАКАЗА В БУФЕР ОБМЕНА =================
function copyOrder(id, btn) {
  const o = orders.find(x => x.id === id) || archived.find(x => x.id === id);
  if (!o) return;

  const lines = [];
  lines.push('Заказ №' + o.number + ' от ' + fmtDate(o.date));
  lines.push('Статус: ' + o.status);
  if (o.name) lines.push('Заказчик: ' + o.name);
  if (o.phone) lines.push('Телефон: ' + o.phone);
  if (o.login) lines.push('Логин: ' + o.login);

  const blocks = normalizeConfigBlocks(o.config);
  // в сообщение идут все отмеченные конфигурации (если ни одна — первая)
  const picked = blocks
    ? (blocks.filter(b => b.selected).length ? blocks.filter(b => b.selected) : [blocks[0]])
    : [];
  const cfg = picked.flatMap(b => (b.items || []))
    .filter(c => !c.skipped && c.name !== 'Не нужно');
  if (cfg.length) {
    lines.push('');
    lines.push('Конфигурация:');
    let total = 0;
    cfg.forEach(c => {
      const qty = (c.qty || 1);
      const qtyTxt = qty > 1 ? ' ×' + qty : '';
      const price = (c.price || 0) * qty;
      total += price;
      lines.push('• ' + c.category + ': ' + c.name + qtyTxt + ' — ' + price.toLocaleString('ru-RU') + ' ₽');
    });
    if (total > 0) lines.push('Сумма: ' + total.toLocaleString('ru-RU') + ' ₽');
  }

  if (o.comment) {
    lines.push('');
    lines.push('Комментарий: ' + o.comment);
  }

  const text = lines.join('\n');
  const done = () => {
    if (!btn) { alert('✓ Заказ №' + o.number + ' скопирован в буфер обмена'); return; }
    const old = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = old; }, 1200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    cb();
  } catch (e) {
    alert('Не удалось скопировать автоматически — выделите текст вручную');
  }
  ta.remove();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return day + '.' + m + '.' + y;
}

// ================= ЖЕЛЕЗО (КОМПЛЕКТУЮЩИЕ) =================
const CATEGORIES = [
  'Процессор', 'Видеокарта', 'Материнская плата', 'Оперативная память',
  'Накопитель', 'Блок питания', 'Корпус', 'Воздушное охлаждение',
  'Жидкостное охлаждение', 'Вентилятор'
];
let partEditId = null;

// заполняем селект категорий в модалке и фильтр на вкладке
(function fillCategorySelects() {
  const opts = CATEGORIES.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  document.getElementById('pCategory').innerHTML = opts;
  document.getElementById('partFilter').innerHTML = '<option value="">Все категории</option>' + opts;
})();

// нормализация названия для поиска дублей: регистр, порядок слов и знаки не важны
function normName(s) {
  return String(s).toLowerCase()
    .replace(/[^a-zа-яё0-9+]+/gi, ' ')
    .trim()
    .split(' ')
    .filter(Boolean)
    .sort()
    .join(' ');
}

function renderParts() {
  document.getElementById('tableHead').innerHTML = '<tr>' +
    '<th>Категория</th><th>Название</th><th>Цена</th><th>Магазин</th><th>Действия</th></tr>';

  // подсказки имён из базы для поиска и поля «Название»
  document.getElementById('partsDatalist').innerHTML =
    [...new Set(parts.map(p => p.name))].sort((a, b) => a.localeCompare(b, 'ru'))
      .map(n => '<option value="' + esc(n) + '">').join('');

  const filter = document.getElementById('partFilter').value;
  const q = document.getElementById('partSearch').value.trim().toLowerCase();
  const data = parts
    .filter(p => !filter || p.category === filter)
    .filter(p => !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q))
    .sort((a, b) =>
      CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category) ||
      a.name.localeCompare(b.name, 'ru'));

  document.getElementById('stats').textContent =
    'Деталей: ' + parts.length +
    ' | Категорий: ' + new Set(parts.map(p => p.category)).size;

  const tbody = document.getElementById('tableBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">' +
      (q ? 'Ничего не найдено по запросу «' + esc(q) + '»'
        : parts.length === 0 ? 'Деталей пока нет — нажмите «+ Добавить деталь»'
        : 'В этой категории ничего нет') +
      '</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(p =>
    '<tr>' +
      '<td>' + esc(p.category) + '</td>' +
      '<td><a class="order-num" title="Редактировать" onclick="openPartModal(' + p.id + ')">' + esc(p.name) + '</a></td>' +
      '<td>' + fmtPrice(p.price) + '</td>' +
      '<td>' + (p.link
        ? '<a class="shop-link" href="' + esc(p.link) + '" target="_blank" rel="noopener">Открыть ↗</a>'
        : '—') + '</td>' +
      '<td class="actions"><button class="btn-arch" onclick="deletePart(' + p.id + ')">✕ Удалить</button></td>' +
    '</tr>'
  ).join('');
}

function fmtPrice(v) {
  const n = parseFloat(v);
  return isNaN(n) || n === 0 ? '—' : n.toLocaleString('ru-RU') + ' ₽';
}

function openPartModal(id) {
  partEditId = (typeof id === 'number') ? id : null;
  const p = partEditId ? parts.find(x => x.id === partEditId) : null;
  document.getElementById('partModalTitle').textContent = p ? 'Редактировать деталь' : 'Новая деталь';
  document.getElementById('pCategory').value = p ? p.category : CATEGORIES[0];
  document.getElementById('pName').value = p ? p.name : '';
  document.getElementById('pPrice').value = p ? (p.price || '') : '';
  document.getElementById('pLink').value = p ? (p.link || '') : '';
  document.getElementById('partOverlay').classList.add('open');
  document.getElementById('pName').focus();
}

function closePartModal() {
  document.getElementById('partOverlay').classList.remove('open');
}

async function savePart() {
  const name = document.getElementById('pName').value.trim();
  if (!name) { alert('Укажите точное название детали'); return; }

  // проверка на дубли: совпадение даже при другом порядке слов и написании
  const nn = normName(name);
  const dup = parts.find(x => x.id !== partEditId && normName(x.name) === nn);
  if (dup && !confirm('Похоже, такая деталь уже есть в базе:\n«' + dup.name + '» (' + dup.category + ')\n\nВсё равно добавить?')) {
    return;
  }

  const row = {
    category: document.getElementById('pCategory').value,
    name: name,
    price: parseFloat(document.getElementById('pPrice').value) || 0,
    link: document.getElementById('pLink').value.trim()
  };
  if (partEditId) {
    const { data, error } = await sb.from('parts').update(row).eq('id', partEditId).select().single();
    if (error) { alert('Ошибка сохранения: ' + error.message); return; }
    parts = parts.map(x => x.id === data.id ? data : x);
  } else {
    const { data, error } = await sb.from('parts').insert(row).select().single();
    if (error) { alert('Ошибка сохранения: ' + error.message); return; }
    parts.push(data);
  }
  closePartModal();
  render();
}

async function deletePart(id) {
  const p = parts.find(x => x.id === id);
  if (!p) return;
  if (!confirm('Удалить деталь «' + p.name + '»?')) return;
  const { error } = await sb.from('parts').delete().eq('id', id);
  if (error) { alert('Ошибка удаления: ' + error.message); return; }
  parts = parts.filter(x => x.id !== id);
  render();
}

// Окна НЕ закрываются по клику на фон — только кнопками внизу окна.
// Это защищает от случайного закрытия и потери введённых данных.

// ================= КОНФИГУРАЦИЯ В ЗАКАЗЕ (СТАТИЧНАЯ ТАБЛИЦА) =================
// Первый столбец — фиксированные строки, второй — деталь из базы «Железо»,
// третий — стоимость вручную. Внизу сумма всех стоимостей.
const CONFIG_LINES = [
  { label: 'Процессор',          cats: ['Процессор'] },
  { label: 'Видеокарта',         cats: ['Видеокарта'] },
  { label: 'Материнская плата',  cats: ['Материнская плата'] },
  { label: 'Оперативная память', cats: ['Оперативная память'] },
  { label: 'Накопитель',         cats: ['Накопитель'] },
  { label: 'Накопитель 2',       cats: ['Накопитель'] },
  { label: 'Охлаждение',         cats: ['Воздушное охлаждение', 'Жидкостное охлаждение'] },
  { label: 'Термопаста',         thermo: [['MX-3', 30000], ['MX-4', 40000], ['MX-5', 50000], ['MX-6', 60000], ['MX-7', 70000], ['MX-8', 80000]] },
  { label: 'Блок питания',       cats: ['Блок питания'] },
  { label: 'Корпус',             cats: ['Корпус'] },
  { label: 'Вентиляторы',        cats: ['Вентилятор'] }
];

// старый формат (плоский список позиций) → новый (блоки конфигураций)
function normalizeConfigBlocks(cfg) {
  if (!cfg || !cfg.length) return null;
  if (Array.isArray(cfg[0] && cfg[0].items)) return cfg;
  return [{ items: cfg.slice(), selected: true }];
}

function itemsTotal(items) {
  return (items || []).reduce((s, c) => s + (c.price || 0) * (c.qty || 1), 0);
}

// сборка строк таблицы конфигурации в указанный tbody
function buildConfigTableInto(tbody, savedList, onChange) {
  savedList = savedList || [];
  const pending = savedList.slice(); // не распределённые сохранённые позиции
  tbody.innerHTML = '';

  CONFIG_LINES.forEach(line => {
    // сначала ищем сохранённую позицию именно этой строки, затем — по категориям старых заказов
    let idx = pending.findIndex(it => it.line === line.label);
    if (idx === -1) idx = pending.findIndex(it => line.cats && line.cats.includes(it.category));
    let saved = null;
    if (idx !== -1) { saved = pending[idx]; pending.splice(idx, 1); }

    const tr = document.createElement('tr');
    if (line.thermo) tr.dataset.thermo = '1';

    const tdLabel = document.createElement('td');
    tdLabel.className = 'config-line';
    tdLabel.textContent = line.label + ':';

    const tdSel = document.createElement('td');
    const sel = document.createElement('select');
    sel.className = 'config-part';

    const tdCost = document.createElement('td');
    let cost = null;

    if (line.thermo) {
      // Термопаста: фиксированные позиции с фиксированной ценой
      let html = '<option value="">— не выбрано —</option>';
      html += '<option value="none">Не нужно</option>';
      line.thermo.forEach(([n, p]) => {
        html += '<option value="' + esc(n) + '" data-price="' + p + '">' + esc(n) + '</option>';
      });
      sel.innerHTML = html;
      if (saved && saved.skipped) sel.value = 'none';
      else if (saved && saved.name) sel.value = saved.name;
      tdCost.textContent = '—';
      tdCost.style.textAlign = 'center';
      tdCost.style.color = 'var(--text-muted)';
    } else {
      const cost = document.createElement('input');
      cost.type = 'number';
      cost.className = 'config-cost';
      cost.min = '0';
      cost.step = '1';
      cost.placeholder = '—';

      function fillParts() {
        const list = parts.filter(p => line.cats.includes(p.category));
        let html = '<option value="">— не выбрано —</option>';
        html += '<option value="none">Не нужно</option>';
        list.forEach(p => {
          html += '<option value="' + p.id + '">' + esc(p.name) + '</option>';
        });
        // деталь удалена из каталога после сохранения заказа — показываем снимок
        if (saved && saved.partId && saved.partId !== 'none' && !list.some(p => String(p.id) === String(saved.partId))) {
          html += '<option value="' + esc(saved.partId) + '">' + esc(saved.name) + ' (нет в каталоге)</option>';
        }
        sel.innerHTML = html;
        if (saved && saved.skipped) sel.value = 'none';
        else if (saved && saved.partId) sel.value = String(saved.partId);
      }

      if (saved && saved.price) cost.value = saved.price;
      fillParts();
      cost.oninput = onChange;
      tdCost.appendChild(cost);
    }

    sel.onchange = onChange;

    tdSel.appendChild(sel);
    tr.appendChild(tdLabel);
    tr.appendChild(tdSel);
    tr.appendChild(tdCost);
    tbody.appendChild(tr);
  });
}

function rowCost(tr) {
  const costEl = tr.querySelector('.config-cost');
  return Math.max(0, Number(costEl && costEl.value) || 0);
}

function fmtMoney(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

// сумма блока — показывается только когда заполнены все строки блока
function updateBlockSum(blockEl) {
  let sum = 0;
  let allFilled = true;
  blockEl.querySelectorAll('tbody tr').forEach(tr => {
    const sel = tr.querySelector('.config-part');
    if (!sel.value) { allFilled = false; return; }
    if (sel.value === 'none') return; // «Не нужно» — на сумму не влияет
    if (tr.dataset.thermo) {
      sum += Number(sel.selectedOptions[0].dataset.price || 0);
      return;
    }
    sum += rowCost(tr);
  });
  const sumEl = blockEl.querySelector('.config-sum');
  sumEl.textContent = allFilled ? 'Сумма конфигурации: ' + fmtMoney(sum) : '';
}

function buildConfigBlock(block, idx) {
  block = block || {};
  const div = document.createElement('div');
  div.className = 'config-block' + (block.collapsed ? ' collapsed' : '') + (block.selected ? ' selected' : '');

  // шапка: чекбокс выбранной конфигурации + сворачивание + удаление
  const head = document.createElement('div');
  head.className = 'config-block-head';

  const title = document.createElement('label');
  title.className = 'config-block-title';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!block.selected;
  cb.title = 'Включить стоимость этой конфигурации в сумму на главной странице (можно отметить несколько — например, заказ на 2 компьютера)';
  cb.onchange = () => {
    if (cb.checked) div.classList.add('selected');
    else div.classList.remove('selected');
  };
  title.appendChild(cb);
  const tspan = document.createElement('span');
  tspan.textContent = 'Конфигурация ' + (idx + 1);
  title.appendChild(tspan);

  const tools = document.createElement('div');
  tools.className = 'config-block-tools';
  const collapse = document.createElement('button');
  collapse.type = 'button';
  collapse.className = 'config-collapse';
  collapse.textContent = block.collapsed ? '▸ Развернуть' : '▾ Свернуть';
  collapse.onclick = () => {
    div.classList.toggle('collapsed');
    collapse.textContent = div.classList.contains('collapsed') ? '▸ Развернуть' : '▾ Свернуть';
  };
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'config-block-del';
  del.textContent = '✕';
  del.title = 'Удалить конфигурацию';
  del.onclick = () => {
    if (document.querySelectorAll('#configBlocks .config-block').length <= 1) {
      alert('Должна остаться хотя бы одна конфигурация');
      return;
    }
    if (!confirm('Удалить «Конфигурация ' + (idx + 1) + '»?')) return;
    const wasSelected = div.classList.contains('selected');
    div.remove();
    renumberConfigBlocks();
    if (wasSelected) {
      const first = document.querySelector('#configBlocks .config-block');
      if (first) {
        first.classList.add('selected');
        const c = first.querySelector('.config-block-title input');
        if (c) c.checked = true;
      }
    }
  };
  tools.appendChild(collapse);
  tools.appendChild(del);

  head.appendChild(title);
  head.appendChild(tools);

  // тело: таблица + сумма
  const body = document.createElement('div');
  body.className = 'config-block-body';
  const table = document.createElement('table');
  table.className = 'config-table';
  table.innerHTML = '<thead><tr><th>Категория</th><th>Деталь</th><th>Стоимость, ₽</th></tr></thead>';
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  const sumEl = document.createElement('div');
  sumEl.className = 'config-sum';
  body.appendChild(table);
  body.appendChild(sumEl);

  div.appendChild(head);
  div.appendChild(body);

  buildConfigTableInto(tbody, block.items || [], () => updateBlockSum(div));
  updateBlockSum(div);
  return div;
}

function renumberConfigBlocks() {
  document.querySelectorAll('#configBlocks .config-block').forEach((b, i) => {
    const span = b.querySelector('.config-block-title span');
    if (span) span.textContent = 'Конфигурация ' + (i + 1);
  });
}

function addConfigBlock() {
  const container = document.getElementById('configBlocks');
  container.appendChild(buildConfigBlock({}, container.querySelectorAll('.config-block').length));
  renumberConfigBlocks();
}

function renderConfigBlocks(blocks) {
  const container = document.getElementById('configBlocks');
  container.innerHTML = '';
  const list = (blocks && blocks.length) ? blocks : [{ items: [], selected: true }];
  list.forEach((b, i) => container.appendChild(buildConfigBlock(b, i)));
}

function collectBlockItems(tbody) {
  const out = [];
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    const line = CONFIG_LINES[i];
    const sel = tr.querySelector('.config-part');
    const val = sel.value;
    if (!val) return;

    if (line.thermo) {
      if (val === 'none') {
        out.push({ line: line.label, category: line.label, name: 'Не нужно', price: 0, skipped: true });
      } else {
        out.push({ line: line.label, category: line.label, name: val, price: Number(sel.selectedOptions[0].dataset.price || 0), qty: 1 });
      }
      return;
    }

    if (val === 'none') {
      out.push({ line: line.label, category: line.label, name: 'Не нужно', price: 0, skipped: true });
      return;
    }
    const opt = sel.selectedOptions[0];
    const p = parts.find(x => String(x.id) === String(val));
    out.push({
      line: line.label,
      category: line.label,
      partId: val,
      name: p ? p.name : opt.textContent.replace(' (нет в каталоге)', ''),
      price: rowCost(tr),
      qty: 1
    });
  });
  return out;
}

function collectConfigBlocks() {
  const out = [];
  document.querySelectorAll('#configBlocks .config-block').forEach(div => {
    out.push({
      items: collectBlockItems(div.querySelector('tbody')),
      selected: div.classList.contains('selected'),
      collapsed: div.classList.contains('collapsed')
    });
  });
  return out;
}

// ================= МЕНЮ СМЕНЫ СТАТУСА =================
let menuOrderId = null;

function openStatusMenu(e, id) {
  e.stopPropagation();
  menuOrderId = id;
  const inOrders = orders.some(x => x.id === id);
  const o = (inOrders ? orders : archived).find(x => x.id === id);
  if (!o) return;

  const menu = document.getElementById('statusMenu');
  menu.querySelectorAll('.menu-item').forEach(item => {
    item.classList.toggle('current', item.dataset.status === o.status);
  });

  // показываем меню рядом с бейджиком
  menu.classList.add('open');
  const rect = e.target.getBoundingClientRect();
  const mw = 200, mh = 130;
  let x = rect.left, y = rect.bottom + 4;
  if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight) y = rect.top - mh - 4;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function closeStatusMenu() {
  document.getElementById('statusMenu').classList.remove('open');
  menuOrderId = null;
}

async function applyStatus(id, status) {
  let o = orders.find(x => x.id === id);
  let fromArchive = false;
  if (!o) { o = archived.find(x => x.id === id); fromArchive = true; }
  if (!o) { closeStatusMenu(); return; }

  const toArchive = status === 'Закрыт';
  const { error } = await sb.from('orders').update({ status: status, archived: toArchive }).eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); closeStatusMenu(); return; }

  o.status = status;
  if (fromArchive) {
    // из архива: любой статус кроме «Закрыт» возвращает заказ в работу
    if (!toArchive) {
      archived = archived.filter(x => x.id !== id);
      orders.push(o);
    }
  } else if (toArchive) {
    // закрытые автоматически уходят в архив
    orders = orders.filter(x => x.id !== id);
    archived.push(o);
  }
  closeStatusMenu();
  render();
}

// клик по пункту меню
document.querySelectorAll('#statusMenu .menu-item').forEach(item => {
  item.addEventListener('click', () => {
    if (menuOrderId != null) applyStatus(menuOrderId, item.dataset.status);
  });
});
// закрытие меню по клику вне его
document.addEventListener('click', e => {
  const menu = document.getElementById('statusMenu');
  if (menu.classList.contains('open') && !menu.contains(e.target)) closeStatusMenu();
});

// ================= МОДАЛКА =================
// следующий свободный номер: максимум по всем заказам в базе + 1
function nextFreeNumber() {
  let max = nextNum - 1;
  orders.concat(archived).forEach(o => {
    const n = parseInt(o.number, 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return String(max + 1).padStart(3, '0');
}

function toggleManualNumber() {
  const manual = document.getElementById('fNumberManual').checked;
  const input = document.getElementById('fNumber');
  input.readOnly = !manual;
  if (!manual) input.value = nextFreeNumber(); // сняли галочку — вернули авто-номер
}

function openAddModal() {
  editingId = null;
  originalOrderComment = '';
  document.getElementById('modalTitle').textContent = 'Новый заказ';
  // Номер подставляется автоматически: предыдущий в базе + 1
  const numInput = document.getElementById('fNumber');
  numInput.value = nextFreeNumber();
  numInput.readOnly = true;

  document.getElementById('fPayment').value = '';
  document.getElementById('fShip').value = '';

  setOrderSectionsCollapsed(true);

function closeModal() {

async function saveOrder() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Укажите имя заказчика'); return; }

  const number = document.getElementById('fNumber').value.trim() || nextFreeNumber();

  // проверка на дубли номеров: нельзя добавить заказ с уже существующим номером
  const n = parseInt(number, 10);
  const dup = orders.concat(archived).find(x => {
    if (editingId && x.id === editingId) return false;
    const xn = parseInt(x.number, 10);
    return (!isNaN(n) && !isNaN(xn)) ? xn === n : x.number === number;
  });
  if (dup) {
    alert('Заказ №' + number + ' уже существует (заказчик: ' + dup.name + ', от ' + fmtDate(dup.date) + ')\nУкажите другой номер.');
    return;
  }

  await refreshCurrentUserLabel();
  const commentFinal = applyCommentStampOnSave();

  const row = {
    number: number,
    date: document.getElementById('fDate').value,
    name: name,
    phone: document.getElementById('fPhone').value.trim(),
    login: document.getElementById('fLogin').value.trim(),
    source: document.getElementById('fSource').value.trim(),
    payment: document.getElementById('fPayment').value.trim(),
    ship: document.getElementById('fShip').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    comment: commentFinal,
    config: collectConfigBlocks(),
    status: document.getElementById('fStatus').value
  };
  const closed = row.status === 'Закрыт';

  // Пробуем сохранить всё; если в таблице orders ещё нет какой-то колонки
  // (source, payment, ship, address...), убираем её из запроса и повторяем.
  // Как только колонку добавят в Supabase — поля начнут сохраняться сами.
  async function write(payload) {
    if (editingId) {
      return sb.from('orders').update({ ...payload, archived: closed }).eq('id', editingId).select().single();
    }
    return sb.from('orders').insert(payload).select().single();
  }

  let saved;
  let payload = { ...row };
  let res = null;
  for (let attempt = 0; attempt < 10; attempt++) {
    res = await write(payload);
    if (!res.error) break;
    // ищем в сообщении об ошибке имя отсутствующей колонки
    const msg = res.error.message || '';
    const matches = msg.match(/'([a-zA-Z_][a-zA-Z0-9_]*)'/g) || [];
    let removed = false;
    for (const m of matches) {
      const col = m.slice(1, -1);
      if (payload.hasOwnProperty(col)) {
        console.warn('Колонки нет в таблице orders: ' + col + ' — сохраняю без неё');
        delete payload[col];
        removed = true;
        break;
      }
    }
    if (!removed) break;
  }
  if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
  saved = res.data;

  if (editingId) {
    orders = orders.filter(x => x.id !== saved.id);
    archived = archived.filter(x => x.id !== saved.id);
  }

  (closed ? archived : orders).push(saved);

  // счётчик номеров растёт при занятом номере
  const usedNum = parseInt(saved.number, 10);
  if (!isNaN(usedNum) && usedNum >= nextNum) {
    nextNum = usedNum + 1;
    sb.from('settings').upsert({ key: 'nextnum', value: nextNum }).then(() => {});
  }

  originalOrderComment = commentFinal || '';
  editingId = null;
  closeModal();
  if (currentTab !== 'orders') switchTab('orders'); else render();
}

// ================= СКЛАД (только для логина admin) =================
let stock = [];                 // позиции склада
let stockEditId = null;         // id редактируемой позиции
let stockRelated = [];          // выбранные id заказов
let stockFiles = [];            // файлы чека {name, mime, size, data}
let posSuggest = [];            // подсказки моделей из «Железо»
let posActive = -1;             // активная подсказка при выборе стрелками
let stockSelected = new Set();  // отмеченные галочками позиции склада

function isAdmin() { return currentUserLabelStr === 'admin'; }

function updateAdminUI() {
  const on = isAdmin();
  document.getElementById('tabStock').style.display = on ? '' : 'none';
  if (!on) document.getElementById('stockActions').style.display = 'none';
  if (!on && currentTab === 'stock') switchTab('orders');
  else document.getElementById('btnAddStock').style.display =
    (on && currentTab === 'stock') ? 'inline-block' : 'none';
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
    '-' + String(d.getDate()).padStart(2, '0');
}

function parseStockValue(v) {
  if (!v) return [];
  try {
    const o = JSON.parse(v);
    return Array.isArray(o) ? o : (Array.isArray(o.items) ? o.items : []);
  } catch (e) { return []; }
}

async function saveStockValue() {
  const { error } = await sb.from('settings')
    .upsert({ key: 'stock_items', value: JSON.stringify({ items: stock }) });
  if (error) throw new Error(error.message);
}

function partName(id) {
  const p = parts.find(x => String(x.id) === String(id));
  if (p) return p.name;
  if (!id) return '—';
  // раньше в складе мог быть просто текст — показываем его как есть
  return /^\d+$/.test(String(id)) ? '—' : String(id);
}
function orderById(id) {
  return orders.find(x => x.id === id) || archived.find(x => x.id === id);
}

function renderStock() {
  if (!isAdmin()) { switchTab('orders'); return; }
  stockSelected = new Set(Array.from(stockSelected).filter(id => stock.some(s => s.id === id)));
  document.getElementById('tableHead').innerHTML =
    '<tr><th style="width:34px"><input type="checkbox" class="stock-check" id="stockCheckAll" ' +
      'onchange="toggleAllStock(this.checked)" title="Выбрать все"></th>' +
    '<th>Дата</th><th>Позиция</th><th>Серийный номер</th><th>Стоимость</th>' +
    '<th>Поставщик</th><th>Связан с заказами</th><th>Гарантия</th><th>Чек</th><th></th></tr>';
  const tbody = document.getElementById('tableBody');
  updateStockActions();
  if (!stock.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Склад пуст — нажмите «+ Добавить позицию»</td></tr>';
    return;
  }
  const sorted = stock.slice().sort((a, b) =>
    String(b.date || '').localeCompare(String(a.date || '')) || (b.id - a.id));
  tbody.innerHTML = sorted.map(s => {
    const rel = (s.related || []).map(id => orderById(id)).filter(Boolean);
    const relHtml = rel.length
      ? rel.map(o => '<a class="order-num" title="Открыть заказ" onclick="event.stopPropagation();openOrderCard(' + o.id + ')">№' + esc(o.number) + '</a>').join(', ')
      : '—';
    const files = s.files || [];
    let checkHtml = s.checkText ? esc(s.checkText) : '';
    if (files.length) checkHtml += (checkHtml ? '<br>' : '') + '📎 ' + files.length;
    return '<tr style="cursor:pointer" onclick="openStockModal(' + s.id + ')">' +
      '<td><input type="checkbox" class="stock-check" value="' + s.id + '" ' +
        (stockSelected.has(s.id) ? 'checked' : '') +
        ' onclick="event.stopPropagation();toggleStockCheck(' + s.id + ',this.checked)"></td>' +
      '<td>' + esc(fmtDate(s.date)) + '</td>' +
      '<td>' + esc(partName(s.position)) + '</td>' +
      '<td>' + esc(s.serial || '—') + '</td>' +
      '<td>' + esc(s.cost || '—') + '</td>' +
      '<td>' + esc(s.supplier || '—') + '</td>' +
      '<td>' + relHtml + '</td>' +
      '<td>' + esc(s.warranty || '—') + '</td>' +
      '<td>' + (checkHtml || '—') + '</td>' +
      '<td><button class="btn-copy" title="Удалить позицию" onclick="event.stopPropagation();deleteStockItem(' + s.id + ')">🗑</button></td>' +
      '</tr>';
  }).join('');
  const all = document.getElementById('stockCheckAll');
  if (all) all.checked = stock.length > 0 && stock.every(s => stockSelected.has(s.id));
}

function updateStockActions() {
  const n = stockSelected.size;
  document.getElementById('stockSelectedCount').textContent = 'Выбрано: ' + n;
  document.getElementById('btnStockDuplicate').disabled = n === 0;
  document.getElementById('btnStockDelete').disabled = n === 0;
}
function toggleStockCheck(id, on) {
  if (on) stockSelected.add(id); else stockSelected.delete(id);
  const all = document.getElementById('stockCheckAll');
  if (all) all.checked = stock.length > 0 && stock.every(s => stockSelected.has(s.id));
  updateStockActions();
}
function toggleAllStock(on) {
  if (on) stock.forEach(s => stockSelected.add(s.id));
  else stockSelected.clear();
  document.querySelectorAll('#tableBody .stock-check').forEach(c => { c.checked = on; });
  updateStockActions();
}
function deleteSelectedStock() {
  if (!isAdmin()) return;
  const ids = Array.from(stockSelected);
  if (!ids.length) { alert('Отметьте позиции галочками'); return; }
  if (!confirm('Удалить выбранных позиций: ' + ids.length + '?')) return;
  stock = stock.filter(x => ids.indexOf(x.id) < 0);
  stockSelected.clear();
  saveStockValue().then(() => render()).catch(e => alert('Ошибка: ' + e.message));
}
function duplicateSelectedStock() {
  if (!isAdmin()) return;
  const ids = Array.from(stockSelected);
  if (!ids.length) { alert('Отметьте позицию галочкой'); return; }
  if (ids.length > 1) { alert('Дублировать можно только одну позицию за раз'); return; }
  const src = stock.find(x => x.id === ids[0]);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = Math.max(Date.now(), ...stock.map(x => Number(x.id) || 0)) + 1;
  if (copy.serial) copy.serial += ' (копия)';
  stock.push(copy);
  stockSelected.clear();
  saveStockValue()
    .then(() => { render(); openStockModal(copy.id); })
    .catch(e => alert('Ошибка: ' + e.message));
}

// ---- Подсказки по моделям из «Железо» (поиск посимвольно) ----
function positionParts() {
  return parts.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru'));
}
function positionLabel(p) {
  return (p.category ? p.category + ': ' : '') + p.name;
}
function positionHighlight(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) +
    '</mark>' + esc(text.slice(i + q.length));
}
function renderPositionSuggest() {
  const box = document.getElementById('sPositionSuggest');
  const q = (document.getElementById('sPosition').value || '').trim().toLowerCase();
  posSuggest = positionParts().filter(p => !q ||
    String(p.name).toLowerCase().indexOf(q) >= 0 ||
    String(p.category || '').toLowerCase().indexOf(q) >= 0
  ).slice(0, 15);
  posActive = -1;
  box.innerHTML = posSuggest.length
    ? posSuggest.map((p, i) =>
        '<div class="stock-suggest-item" onmousedown="choosePosition(' + i + ')">' +
        positionHighlight(positionLabel(p), q) + '</div>').join('')
    : '<div class="stock-suggest-empty">В «Железо» нет такой модели — можно ввести название вручную.</div>';
  box.classList.add('open');
}
function hidePositionSuggest(delay) {
  const box = document.getElementById('sPositionSuggest');
  if (delay) setTimeout(() => box.classList.remove('open'), delay);
  else box.classList.remove('open');
}
function onPositionInput() {
  const id = document.getElementById('sPositionId').value;
  const p = parts.find(x => String(x.id) === String(id));
  if (p && (document.getElementById('sPosition').value || '').trim() !== p.name) {
    document.getElementById('sPositionId').value = '';
  }
  renderPositionSuggest();
}
function choosePosition(i) {
  const p = posSuggest[i];
  if (!p) return;
  document.getElementById('sPosition').value = p.name;
  document.getElementById('sPositionId').value = p.id;
  hidePositionSuggest();
}
function onPositionKey(e) {
  const box = document.getElementById('sPositionSuggest');
  if (e.key === 'Escape') { hidePositionSuggest(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!box.classList.contains('open')) renderPositionSuggest();
    if (!posSuggest.length) return;
    posActive = e.key === 'ArrowDown'
      ? (posActive + 1) % posSuggest.length
      : (posActive <= 0 ? posSuggest.length - 1 : posActive - 1);
    box.querySelectorAll('.stock-suggest-item').forEach((el, i) =>
      el.classList.toggle('active', i === posActive));
    return;
  }
  if (e.key === 'Enter' && posActive >= 0) {
    e.preventDefault();
    choosePosition(posActive);
  }
}

// ---- Гарантия: всё приводим к виду «До ДД.ММ.ГГГГ» ----
function pad2(n) { return String(n).padStart(2, '0'); }
function warrantyFromBase(baseDate, months) {
  let y = new Date().getFullYear(), m = new Date().getMonth() + 1, d = new Date().getDate();
  const parts = String(baseDate || '').split('-').map(Number);
  if (parts.length === 3 && parts[0] > 1900 && parts[1] >= 1 && parts[1] <= 12 && parts[2] >= 1 && parts[2] <= 31) {
    y = parts[0]; m = parts[1]; d = parts[2];
  }
  const dt = new Date(y, m - 1 + months, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  dt.setDate(Math.min(d, last));
  return 'До ' + pad2(dt.getDate()) + '.' + pad2(dt.getMonth() + 1) + '.' + dt.getFullYear();
}
function normalizeWarranty(raw, baseDate) {
  const s = String(raw || '').trim().replace(/\s+/g, ' ');
  if (!s) return '';
  const low = s.toLowerCase().replace(/ё/g, 'е');
  // уже дата: «до 19.07.2028», «19.07.2028»
  let m = low.match(/(?:до\s*)?(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if (m) {
    let yr = m[3];
    if (yr.length === 2) yr = '20' + yr;
    return 'До ' + pad2(m[1]) + '.' + pad2(m[2]) + '.' + yr;
  }
  // года: «2 года», «1 год», «5 лет», «2 г.», «1,5 года»
  m = low.match(/^(\d+(?:[.,]\d+)?)\s*(года|год|лет|г\.|г)$/);
  if (m) return warrantyFromBase(baseDate, Math.round(parseFloat(m[1].replace(',', '.')) * 12));
  // месяцы: «60 мес», «60 месяцев», «12 мес.», «6 месяцев»
  m = low.match(/^(\d+(?:[.,]\d+)?)\s*(месяцев|месяца|месяц|мес\.|мес)$/);
  if (m) return warrantyFromBase(baseDate, Math.round(parseFloat(m[1].replace(',', '.'))));
  return s;
}
function warrantyBaseDate() {
  const d = document.getElementById('sDate').value;
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : todayStr();
}
function previewWarranty() {
  const raw = document.getElementById('sWarranty').value;
  const res = normalizeWarranty(raw, warrantyBaseDate());
  document.getElementById('sWarrantyHint').textContent =
    (res && res !== raw.trim()) ? 'Будет сохранено: ' + res : '';
}
function applyWarranty() {
  const inp = document.getElementById('sWarranty');
  inp.value = normalizeWarranty(inp.value, warrantyBaseDate());
  previewWarranty();
}

async function openStockModal(id) {
  if (!isAdmin()) return;
  stockEditId = id || null;
  const s = id ? stock.find(x => x.id === id) : null;
  document.querySelectorAll('[data-stock-more]').forEach(d => { d.open = false; });
  document.getElementById('stockModalTitle').textContent = s ? 'Редактировать позицию' : 'Новая позиция';
  document.getElementById('sDateManual').checked = s ? !!s.dateManual : false;
  document.getElementById('sDate').value = s ? (s.date || '') : todayStr();
  document.getElementById('sDate').readOnly = !document.getElementById('sDateManual').checked;

  const pid = s ? String(s.position || '') : '';
  const existing = parts.find(x => String(x.id) === pid);
  document.getElementById('sPosition').value =
    existing ? existing.name : (pid && !/^\d+$/.test(pid) ? pid : '');
  document.getElementById('sPositionId').value = existing ? existing.id : '';
  hidePositionSuggest();

  document.getElementById('sSerial').value = s ? (s.serial || '') : '';
  document.getElementById('sCost').value = s ? (s.cost || '') : '';
  document.getElementById('sSupplier').value = s ? (s.supplier || '') : '';
  document.getElementById('sWarranty').value = s ? (s.warranty || '') : '';
  document.getElementById('sCheckText').value = s ? (s.checkText || '') : '';

  stockRelated = s ? (s.related || []).slice() : [];
  stockFiles = s ? (s.files || []).map(f => Object.assign({}, f)) : [];
  document.getElementById('sOrderSearch').value = '';
  document.getElementById('stockFileInput').value = '';
  renderStockRel();
  renderStockFiles();
  previewWarranty();
  document.getElementById('stockOverlay').classList.add('open');
  if (!s) setTimeout(() => {
    document.getElementById('sPosition').focus();
    renderPositionSuggest();
  }, 60);
}

function closeStockModal() {
  document.getElementById('stockOverlay').classList.remove('open');
  hidePositionSuggest();
}

function renderStockRel() {
  const q = (document.getElementById('sOrderSearch').value || '').trim().toLowerCase();
  const all = orders.concat(archived);
  const found = q ? all.filter(o =>
    [o.number, o.name, o.login, o.phone].some(v => String(v || '').toLowerCase().indexOf(q) >= 0)
  ).slice(0, 30) : [];
  document.getElementById('sOrderResults').innerHTML = !q
    ? '<div class="stock-rel-empty">Введите номер, имя или логин заказчика</div>'
    : (found.length
      ? found.map(o => '<label class="stock-rel-item"><input type="checkbox" ' +
          (stockRelated.indexOf(o.id) >= 0 ? 'checked' : '') +
          ' onchange="toggleStockRel(' + o.id + ',this.checked)"> <span>№' + esc(o.number) +
          ' — ' + esc(o.name) + '</span></label>').join('')
      : '<div class="stock-rel-empty">Ничего не найдено</div>');
  document.getElementById('sOrderSelected').innerHTML = stockRelated.length
    ? stockRelated.map(id => {
        const o = orderById(id);
        return '<span class="stock-chip">№' + esc(o ? o.number : id) +
          ' <button type="button" title="Отвязать" onclick="toggleStockRel(' + id + ',false)">×</button></span>';
      }).join('')
    : '';
}

function toggleStockRel(id, on) {
  if (on) { if (stockRelated.indexOf(id) < 0) stockRelated.push(id); }
  else stockRelated = stockRelated.filter(x => x !== id);
  renderStockRel();
}

function renderStockFiles() {
  document.getElementById('sFiles').innerHTML = stockFiles.length
    ? stockFiles.map((f, i) =>
        '<div class="stock-file"><a href="data:' + esc(f.mime) + ';base64,' + f.data +
        '" download="' + esc(f.name) + '">' + esc(f.name) + '</a>' +
        '<span class="stock-file-size">' + Math.round((f.size || 0) / 1024) + ' КБ</span>' +
        '<button type="button" title="Удалить файл" onclick="removeStockFile(' + i + ')">×</button></div>'
      ).join('')
    : '<div class="stock-rel-empty">Файлы не прикреплены</div>';
}

function removeStockFile(i) {
  stockFiles.splice(i, 1);
  renderStockFiles();
}

async function addStockFiles(list) {
  for (const file of Array.from(list || [])) {
    if (file.size > 2 * 1024 * 1024) {
      alert('Файл «' + file.name + '» больше 2 МБ — пропущен. Уменьшите фото перед загрузкой.');
      continue;
    }
    const data = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    stockFiles.push({
      name: file.name,
      mime: file.type || 'application/octet-stream',
      size: file.size,
      data: data
    });
  }
  renderStockFiles();
}

async function saveStockItem() {
  if (!isAdmin()) return;
  const dateManual = document.getElementById('sDateManual').checked;
  const date = dateManual ? document.getElementById('sDate').value : todayStr();
  if (!date) { alert('Укажите дату'); return; }
  const item = {
    id: stockEditId || Date.now(),
    date: date,
    dateManual: dateManual,
    position: document.getElementById('sPositionId').value ||
              document.getElementById('sPosition').value.trim(),
    serial: document.getElementById('sSerial').value.trim(),
    cost: document.getElementById('sCost').value.trim(),
    supplier: document.getElementById('sSupplier').value.trim(),
    related: stockRelated.slice(),
    warranty: normalizeWarranty(document.getElementById('sWarranty').value.trim(), date),
    checkText: document.getElementById('sCheckText').value.trim(),
    files: stockFiles.slice()
  };
  if (stockEditId) stock = stock.map(x => x.id === stockEditId ? item : x);
  else stock.push(item);
  try { await saveStockValue(); }
  catch (e) { alert('Ошибка сохранения: ' + e.message); return; }
  closeStockModal();
  render();
}

function deleteStockItem(id) {
  if (!isAdmin()) return;
  if (!confirm('Удалить позицию со склада?')) return;
  stock = stock.filter(x => x.id !== id);
  saveStockValue().then(() => render()).catch(e => alert('Ошибка: ' + e.message));
}

// Галочка «Указать вручную» разрешает редактировать дату; без неё дата = сегодня
document.getElementById('sDateManual').addEventListener('change', function () {
  const d = document.getElementById('sDate');
  d.readOnly = !this.checked;
  if (!this.checked) d.value = todayStr();
  previewWarranty();
});
// Если дату всё же поменяли — ставим галочку сами
document.getElementById('sDate').addEventListener('change', () => {
  document.getElementById('sDateManual').checked = true;
  document.getElementById('sDate').readOnly = false;
  previewWarranty();
});

// ================= АВТОВХОД =================
// если пользователь уже входил (сессия сохранена) — открываем приложение сразу
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) await enterApp();
})();
</script>
