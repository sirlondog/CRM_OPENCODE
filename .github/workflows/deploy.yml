name: Deploy CRM to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload index.html to crm.star-comp.ru via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          python3 -m pip install --quiet paramiko
          python3 - <<'PY'
          import os
          import paramiko

          host = os.environ['SFTP_HOST']
          port = int(os.environ.get('SFTP_PORT') or 22)
          user = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']
          target = os.environ['SFTP_TARGET'].strip().rstrip('/')

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(host, port=port, username=user, password=password, timeout=30)
          sftp = client.open_sftp()

          # На reg.ru путь обычно относительный: www/имя-домена.
          # Подстрахуемся, если в секрете указали ведущий / или только имя домена.
          candidates = [target, target.lstrip('/')]
          if '/' not in target.lstrip('/'):
              candidates.append('www/' + target.lstrip('/'))
          candidates.append('www/' + target.lstrip('/').split('/')[-1])
          chosen = None
          for candidate in dict.fromkeys(candidates):
              try:
                  if sftp.stat(candidate):
                      chosen = candidate
                      break
              except Exception:
                  pass
          if not chosen:
              raise SystemExit('SFTP target not found: ' + ', '.join(candidates))

          remote = chosen + '/index.html'
          try:
              sftp.remove(remote + '.deploy-tmp')
          except Exception:
              pass
          sftp.put('hosting/index.html', remote)
          try:
              sftp.chmod(remote, 0o644)
          except Exception:
              pass

          sftp.close()
          client.close()
          print('Deployed hosting/index.html to ' + remote)
          PY
